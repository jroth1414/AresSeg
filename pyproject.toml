[build-system]
requires = ["setuptools>=68,<81", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "aresseg"
version = "0.1.0"
description = "Terrain-aware semantic segmentation for Mars rover drivability on AI4Mars (JHU EN.705.742)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "John Roth" }]
keywords = ["semantic-segmentation", "mars", "ai4mars", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/jroth1414/AresSeg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]   # line length handled by black

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration and not network'"
markers = [
    "integration: end-to-end test that needs network/download (excluded by default)",
    "network: test that touches the network (excluded by default in CI)",
]
