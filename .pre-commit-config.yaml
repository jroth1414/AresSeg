minimum_pre_commit_version: "3.8.0"
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check
        language: system
        types_or: [python, pyi]
      - id: black
        name: black
        entry: python -m black --check
        language: system
        types_or: [python, pyi]
      - id: repository-integrity
        name: repository integrity
        entry: python scripts/check_integrity.py
        language: system
        pass_filenames: false
        always_run: true
      - id: commit-message-policy
        name: commit message policy
        entry: python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
