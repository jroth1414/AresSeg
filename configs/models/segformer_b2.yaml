# SegFormer MiT-B2 with ImageNet-pretrained encoder (larger arm). The revision is the official HF
# safetensors conversion commit whose parent is the original preregistered weight revision.
model: {name: segformer, backbone: b2, results_backbone: mit-b2, pretrained: true,
        revision: d15ed1f9ae92346f6a6067dbb490a62494ae0d28,
        weights_filename: model.safetensors,
        weights_sha256: b3ad4dd552f9e1b871f46666f39187414133b861e3d07eda016600230f8a1ad6}
train: {batch_size: 8, max_epochs: 50, lr: 3e-4, weight_decay: 1e-4, dice_weight: 1.0,
        ignore_index: 255, early_stop_patience: 10, grad_clip: 1.0}
