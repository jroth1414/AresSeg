name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-cpu.lock.txt
            requirements.lock.txt

      - name: Verify immutable inputs
        run: python scripts/check_integrity.py

      - name: Install locked CPU environment and local source
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements-cpu.lock.txt
          python -m pip install --disable-pip-version-check -r requirements.lock.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .

      - name: Ruff
        run: python -m ruff check .

      - name: Black (check)
        run: python -m black --check .

      - name: Pytest (CPU, no network)
        run: python -m pytest -q
